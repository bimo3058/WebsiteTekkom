<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; font-family: 'Inter Tight', system-ui, sans-serif; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; }
  .swatch { flex: 1; border-radius: 8px; overflow: hidden; box-shadow: 0px 0px 0px 1px rgba(18,55,105,0.08), 0px 1px 2px 0px rgba(9,25,72,0.13); }
  .swatch-color { height: 64px; }
  .swatch-info { padding: 8px 10px; background: #fff; }
  .swatch-name { font-size: 12px; font-weight: 600; color: #353849; }
  .swatch-hex { font-size: 11px; color: #808897; margin-top: 2px; font-family: monospace; }
</style>
</head>
<body>
<!-- Light tints -->
<div class="row">
  <div class="swatch">
    <div class="swatch-color" style="background:#E8EDF7;border-bottom:1px solid #eee"></div>
    <div class="swatch-info"><div class="swatch-name">Primary 50</div><div class="swatch-hex">#E8EDF7</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#C2CEEA"></div>
    <div class="swatch-info"><div class="swatch-name">Primary 100</div><div class="swatch-hex">#C2CEEA</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#8FA3D1"></div>
    <div class="swatch-info"><div class="swatch-name">Primary 200</div><div class="swatch-hex">#8FA3D1</div></div>
  </div>
</div>
<!-- Mid tones -->
<div class="row">
  <div class="swatch">
    <div class="swatch-color" style="background:#5C78B8"></div>
    <div class="swatch-info"><div class="swatch-name">Primary 300</div><div class="swatch-hex">#5C78B8</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#3C518B"></div>
    <div class="swatch-info"><div class="swatch-name">Primary 400</div><div class="swatch-hex">#3C518B</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#0B266E"></div>
    <div class="swatch-info"><div class="swatch-name">Primary 500 — Base</div><div class="swatch-hex">#0B266E</div></div>
  </div>
</div>
<!-- Dark shades -->
<div class="row">
  <div class="swatch">
    <div class="swatch-color" style="background:#091958"></div>
    <div class="swatch-info"><div class="swatch-name">Primary 600</div><div class="swatch-hex">#091958</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#071742"></div>
    <div class="swatch-info"><div class="swatch-name">Primary 700</div><div class="swatch-hex">#071742</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#020816"></div>
    <div class="swatch-info"><div class="swatch-name">Primary 800</div><div class="swatch-hex">#020816</div></div>
  </div>
</div>
</body>
</html>
