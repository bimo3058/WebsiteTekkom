<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; font-family: 'Inter Tight', sans-serif; padding: 20px; }
  .row { display: flex; gap: 6px; }
  .swatch { flex: 1; border-radius: 8px; overflow: hidden; box-shadow: 0px 0px 0px 1px rgba(18,55,105,0.08), 0px 1px 2px 0px rgba(9,25,72,0.13); }
  .swatch-color { height: 60px; }
  .swatch-info { padding: 6px 8px; background: #fff; }
  .swatch-name { font-size: 11px; font-weight: 600; color: #353849; }
  .swatch-hex { font-size: 10px; color: #808897; margin-top: 1px; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch"><div class="swatch-color" style="background:#F6F8FA;border-bottom:1px solid #eee"></div><div class="swatch-info"><div class="swatch-name">Grey 0</div><div class="swatch-hex">#F6F8FA</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#ECEFF3"></div><div class="swatch-info"><div class="swatch-name">Grey 50</div><div class="swatch-hex">#ECEFF3</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#DFE1E7"></div><div class="swatch-info"><div class="swatch-name">Grey 100</div><div class="swatch-hex">#DFE1E7</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#C1C7CF"></div><div class="swatch-info"><div class="swatch-name">Grey 200</div><div class="swatch-hex">#C1C7CF</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#A4ABB8"></div><div class="swatch-info"><div class="swatch-name">Grey 300</div><div class="swatch-hex">#A4ABB8</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#808897"></div><div class="swatch-info"><div class="swatch-name">Grey 400</div><div class="swatch-hex">#808897</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#666D80"></div><div class="swatch-info"><div class="swatch-name">Grey 500</div><div class="swatch-hex">#666D80</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#353849"></div><div class="swatch-info"><div class="swatch-name">Grey 600</div><div class="swatch-hex">#353849</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#272B38"></div><div class="swatch-info"><div class="swatch-name">Grey 700</div><div class="swatch-hex">#272B38</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#1A1B25"></div><div class="swatch-info"><div class="swatch-name">Grey 800</div><div class="swatch-hex">#1A1B25</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#0D0D12"></div><div class="swatch-info"><div class="swatch-name">Grey 900</div><div class="swatch-hex">#0D0D12</div></div></div>
</div>
</body>
</html>
