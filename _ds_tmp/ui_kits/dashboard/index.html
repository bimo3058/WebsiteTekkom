<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SITKOM Dashboard UI Kit</title>
<style>
@font-face {
  font-family: 'Inter Tight';
  src: url('../../fonts/InterTight-VariableFont_wght.ttf') format('truetype');
  font-weight: 100 900; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Inter Tight';
  src: url('../../fonts/InterTight-Italic-VariableFont_wght.ttf') format('truetype');
  font-weight: 100 900; font-style: italic; font-display: swap;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Inter Tight', system-ui, sans-serif; background: #F6F8FA; color: #0D0D12; -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// ─── TOKENS ────────────────────────────────────────────────────────
const C = {
  primary: '#0B266E', primaryHover: '#091958', primarySubtle: 'rgba(11,38,110,0.08)', primaryBorder: '#3C518B',
  bg: '#F6F8FA', card: '#FFFFFF', border: '#DFE1E7', borderStrong: '#C1C7CF',
  fg: '#0D0D12', fgSec: '#353849', fgMuted: '#666D80', fgPlaceholder: '#A4ABB8',
  success: '#40C4AA', successSubtle: '#DDF2EE', successDark: '#174E43',
  warning: '#D39C3D', warningSubtle: '#F9ECCB', warningDark: '#5B3D1E',
  error: '#DF1C41', errorSubtle: '#FADAE1', errorDark: '#710E21',
  sky: '#106A97', skySubtle: '#D1F0F9',
};

// ─── ICONS ─────────────────────────────────────────────────────────
const Icon = ({ d, size = 16, color = C.fgMuted, fill = 'none', sw = 1.8 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
    {Array.isArray(d) ? d.map((p, i) => <path key={i} d={p} />) : <path d={d} />}
  </svg>
);

const IGrid = ({ c = C.fgMuted, s = 16 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>;
const IUsers = ({ c = C.fgMuted, s = 16 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
const ILayers = ({ c = C.fgMuted, s = 16 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>;
const IClip = ({ c = C.fgMuted, s = 16 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>;
const IFile = ({ c = C.fgMuted, s = 16 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13,2 13,9 20,9"/></svg>;
const IGear = ({ c = C.fgMuted, s = 16 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
const IBar = ({ c = C.fgMuted, s = 16 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>;
const IBell = ({ c = C.fgMuted, s = 16 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>;
const ISearch = ({ c = C.fgMuted, s = 16 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
const IPlus = ({ c = '#fff', s = 16 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2.2" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
const IChevR = ({ c = C.fgPlaceholder, s = 14 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>;
const IArrowUp = ({ c, s = 14 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2.2" strokeLinecap="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>;
const IArrowDown = ({ c, s = 14 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2.2" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>;
const ILogOut = ({ c = C.fgMuted, s = 16 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>;

// ─── LOGO MARK ─────────────────────────────────────────────────────
const LogoMark = ({ size = 32 }) => (
  <div style={{ width: size, height: size, borderRadius: size * 0.25, background: 'linear-gradient(135deg,#3C518B,#0B266E)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
    <svg width={size * 0.56} height={size * 0.56} viewBox="0 0 18 18" fill="white">
      <path d="M12.448 0L5.552 0L0 5.552L0 12.448L5.552 18L12.448 18L18 12.448L18 5.552L12.448 0ZM6.506 12.535L2.949 8.978L6.506 5.422C7.851 4.077 10.063 4.077 11.407 5.422L14.964 8.978L11.407 12.535C10.063 13.88 7.894 13.88 6.506 12.535Z"/>
    </svg>
  </div>
);

// ─── AVATAR ────────────────────────────────────────────────────────
const Avatar = ({ initials = 'AM', size = 32 }) => (
  <div style={{ width: size, height: size, borderRadius: '50%', background: 'linear-gradient(135deg,#3C518B,#0B266E)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontWeight: 700, fontSize: size * 0.35, flexShrink: 0, fontFamily: 'Inter Tight, sans-serif' }}>
    {initials}
  </div>
);

// ─── BADGE ─────────────────────────────────────────────────────────
const Badge = ({ label, color = C.primary, bg = C.primarySubtle, dot }) => (
  <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, background: bg, color, fontSize: 12, fontWeight: 500, padding: '3px 9px', borderRadius: 9999, letterSpacing: '0.01em', whiteSpace: 'nowrap' }}>
    {dot && <span style={{ width: 6, height: 6, borderRadius: '50%', background: color, flexShrink: 0 }}></span>}
    {label}
  </span>
);

// ─── SIDEBAR ───────────────────────────────────────────────────────
function Sidebar({ page, onNav }) {
  const sections = [
    { title: 'Utama', items: [{ id: 'dashboard', label: 'Dashboard', Icon: IGrid }] },
    { title: 'Kendali', items: [
      { id: 'banksoal', label: 'Bank Soal', Icon: ILayers, badge: '3' },
      { id: 'mahasiswa', label: 'Manajemen Mahasiswa', Icon: IUsers },
      { id: 'capstone', label: 'Capstone', Icon: IClip },
      { id: 'eoffice', label: 'E-Office', Icon: IFile },
    ]},
    { title: 'Setting', items: [
      { id: 'settings', label: 'Modul Setting', Icon: IGear },
      { id: 'monitor', label: 'System Monitor', Icon: IBar, disabled: true },
    ]},
  ];
  const [hovered, setHovered] = useState(null);
  return (
    <div style={{ width: 272, height: '100%', background: '#fff', borderRight: `1px solid ${C.border}`, display: 'flex', flexDirection: 'column', flexShrink: 0, overflow: 'hidden' }}>
      {/* Brand */}
      <div style={{ padding: '20px 8px 12px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', borderRadius: 10 }}>
          <LogoMark size={34} />
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontWeight: 700, fontSize: 18, color: C.fg, lineHeight: 1.2 }}>SITKOM</div>
            <div style={{ fontSize: 9, fontWeight: 600, color: C.fgPlaceholder, lineHeight: 1.3, letterSpacing: '0.03em', textTransform: 'uppercase', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>Sistem Informasi Teknik Komputer</div>
          </div>
          <div style={{ width: 24, height: 24, border: `1px solid ${C.border}`, borderRadius: 6, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', flexShrink: 0, background: '#fff' }}>
            <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke={C.fgMuted} strokeWidth="1.8"><path d="M7 2L3 6L7 10"/></svg>
          </div>
        </div>
      </div>

      {/* Nav */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '0 16px', display: 'flex', flexDirection: 'column', gap: 0 }}>
        {sections.map((sec, si) => (
          <div key={si} style={{ marginBottom: 8 }}>
            {si > 0 && <div style={{ height: 1, background: '#F0F1F4', margin: '4px 0 8px' }} />}
            <div style={{ fontSize: 11, fontWeight: 500, color: C.fgPlaceholder, letterSpacing: '0.04em', textTransform: 'uppercase', padding: '4px 12px', marginBottom: 2 }}>{sec.title}</div>
            {sec.items.map(item => {
              const isActive = page === item.id;
              const isDisabled = item.disabled;
              const isHov = hovered === item.id && !isActive && !isDisabled;
              return (
                <div key={item.id}
                  onClick={() => !isDisabled && onNav(item.id)}
                  onMouseEnter={() => setHovered(item.id)}
                  onMouseLeave={() => setHovered(null)}
                  style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', borderRadius: 8, cursor: isDisabled ? 'default' : 'pointer', background: isActive ? C.primary : isHov ? '#F6F8FA' : 'transparent', opacity: isDisabled ? 0.45 : 1, transition: 'background 0.12s', marginBottom: 2 }}>
                  <item.Icon c={isActive ? '#fff' : isDisabled ? C.fgPlaceholder : C.fgMuted} s={16} />
                  <span style={{ fontSize: 14, fontWeight: isActive ? 600 : 500, color: isActive ? '#fff' : isDisabled ? C.fgPlaceholder : C.fgSec, flex: 1, letterSpacing: '0.01em', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{item.label}</span>
                  {item.badge && <span style={{ background: isActive ? 'rgba(255,255,255,0.25)' : C.errorSubtle, color: isActive ? '#fff' : C.error, fontSize: 11, fontWeight: 600, padding: '2px 7px', borderRadius: 9999 }}>{item.badge}</span>}
                </div>
              );
            })}
          </div>
        ))}
      </div>

      {/* User footer */}
      <div style={{ padding: '12px 16px', borderTop: `1px solid ${C.border}` }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 12px', borderRadius: 8, cursor: 'pointer' }}
          onMouseEnter={e => e.currentTarget.style.background = '#F6F8FA'}
          onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
          <Avatar initials="AM" size={32} />
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: C.fg, lineHeight: 1.2 }}>Admin SITKOM</div>
            <div style={{ fontSize: 11, color: C.fgMuted, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>admin@undip.ac.id</div>
          </div>
          <ILogOut c={C.fgPlaceholder} s={14} />
        </div>
      </div>
    </div>
  );
}

// ─── TOPBAR ────────────────────────────────────────────────────────
function TopBar({ title, onBtnClick }) {
  return (
    <div style={{ height: 56, borderBottom: `1px solid ${C.border}`, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 24px', background: '#fff', flexShrink: 0, gap: 16 }}>
      <div style={{ fontWeight: 700, fontSize: 16, color: C.fg }}>{title}</div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <div style={{ position: 'relative', width: 36, height: 36, borderRadius: 8, border: `1px solid ${C.border}`, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', background: '#fff' }}>
          <IBell c={C.fgMuted} s={16} />
          <span style={{ position: 'absolute', top: 8, right: 8, width: 7, height: 7, background: C.error, borderRadius: '50%', border: '1.5px solid #fff' }}></span>
        </div>
        <div style={{ width: 36, height: 36, borderRadius: 8, border: `1px solid ${C.border}`, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', background: '#fff' }}>
          <ISearch c={C.fgMuted} s={16} />
        </div>
        <button onClick={onBtnClick} style={{ display: 'flex', alignItems: 'center', gap: 6, background: C.primary, color: '#fff', border: 'none', borderRadius: 8, padding: '8px 14px', fontFamily: 'Inter Tight, sans-serif', fontWeight: 600, fontSize: 13, cursor: 'pointer', letterSpacing: '0.01em' }}>
          <IPlus c="#fff" s={14} /> Tambah
        </button>
      </div>
    </div>
  );
}

// ─── STAT CARD ─────────────────────────────────────────────────────
function StatCard({ label, value, sub, trendVal, trendUp, iconBg, children }) {
  return (
    <div style={{ background: '#fff', border: `1px solid ${C.border}`, borderRadius: 14, padding: '18px 20px', flex: 1, display: 'flex', flexDirection: 'column', gap: 10, boxShadow: '0 1px 2px rgba(228,229,231,0.24)' }}>
      <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between' }}>
        <span style={{ fontSize: 13, fontWeight: 500, color: C.fgMuted, letterSpacing: '0.01em' }}>{label}</span>
        <div style={{ width: 34, height: 34, borderRadius: 9, background: iconBg || C.primarySubtle, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>{children}</div>
      </div>
      <div style={{ fontSize: 28, fontWeight: 700, color: C.fg, lineHeight: 1.0, letterSpacing: '-0.02em' }}>{value}</div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
        {trendUp !== undefined && (trendUp
          ? <IArrowUp c={C.success} s={12} />
          : <IArrowDown c={C.error} s={12} />)}
        <span style={{ fontSize: 12, fontWeight: 600, color: trendUp ? C.success : C.error }}>{trendVal}</span>
        <span style={{ fontSize: 12, color: C.fgMuted }}>{sub}</span>
      </div>
    </div>
  );
}

// ─── MINI BAR CHART ────────────────────────────────────────────────
function MiniBarChart() {
  const data = [
    { m: 'Jan', v: 55, e: 40 }, { m: 'Feb', v: 70, e: 55 }, { m: 'Mar', v: 60, e: 48 },
    { m: 'Apr', v: 80, e: 65 }, { m: 'Mei', v: 75, e: 58 }, { m: 'Jun', v: 90, e: 72 },
    { m: 'Jul', v: 85, e: 68 }, { m: 'Agu', v: 95, e: 78 }, { m: 'Sep', v: 88, e: 70 },
    { m: 'Okt', v: 72, e: 60 }, { m: 'Nov', v: 65, e: 52 }, { m: 'Des', v: 78, e: 62 },
  ];
  const maxVal = 100;
  const barH = 160;
  return (
    <div style={{ display: 'flex', gap: 8, alignItems: 'flex-end', height: barH + 24, padding: '0 4px' }}>
      {data.map((d, i) => (
        <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
          <div style={{ width: '100%', display: 'flex', gap: 2, alignItems: 'flex-end', height: barH }}>
            <div style={{ flex: 1, height: `${(d.v / maxVal) * barH}px`, background: C.primary, borderRadius: '3px 3px 0 0', opacity: 0.85, transition: 'height 0.3s' }} />
            <div style={{ flex: 1, height: `${(d.e / maxVal) * barH}px`, background: C.border, borderRadius: '3px 3px 0 0', transition: 'height 0.3s' }} />
          </div>
          <span style={{ fontSize: 10, color: C.fgPlaceholder, letterSpacing: '0.01em' }}>{d.m}</span>
        </div>
      ))}
    </div>
  );
}

// ─── TABLE ROW ─────────────────────────────────────────────────────
function TableRow({ nim, name, prodi, status, nilai }) {
  const statusMap = {
    'Aktif':    { c: C.success, bg: C.successSubtle },
    'Cuti':     { c: C.warning, bg: C.warningSubtle },
    'Lulus':    { c: C.sky,     bg: C.skySubtle },
    'Nonaktif': { c: C.error,   bg: C.errorSubtle },
  };
  const s = statusMap[status] || statusMap['Aktif'];
  return (
    <div style={{ display: 'flex', alignItems: 'center', padding: '12px 20px', borderBottom: `1px solid #F8F9FB`, gap: 0 }}
      onMouseEnter={e => e.currentTarget.style.background = '#FAFAFC'}
      onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
      <div style={{ width: 130, fontSize: 13, fontWeight: 600, color: C.fg, letterSpacing: '0.01em' }}>{nim}</div>
      <div style={{ flex: 1, fontSize: 13, color: C.fgSec, fontWeight: 500 }}>{name}</div>
      <div style={{ width: 160, fontSize: 12, color: C.fgMuted }}>{prodi}</div>
      <div style={{ width: 90 }}><Badge label={status} color={s.c} bg={s.bg} dot /></div>
      <div style={{ width: 60, fontSize: 13, fontWeight: 600, color: C.fg, textAlign: 'right' }}>{nilai}</div>
    </div>
  );
}

// ─── ACTIVITY ITEM ─────────────────────────────────────────────────
function ActivityItem({ title, time, type }) {
  const typeMap = {
    soal: { c: C.primary, bg: C.primarySubtle },
    mhs: { c: C.success, bg: C.successSubtle },
    cap: { c: C.sky, bg: C.skySubtle },
    warn: { c: C.warning, bg: C.warningSubtle },
  };
  const t = typeMap[type] || typeMap.soal;
  return (
    <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start', padding: '10px 0', borderBottom: '1px solid #F8F9FB' }}>
      <div style={{ width: 32, height: 32, borderRadius: 8, background: t.bg, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, marginTop: 1 }}>
        <div style={{ width: 8, height: 8, borderRadius: '50%', background: t.c }} />
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 13, color: C.fgSec, lineHeight: 1.4, fontWeight: 500 }}>{title}</div>
        <div style={{ fontSize: 11, color: C.fgPlaceholder, marginTop: 2 }}>{time}</div>
      </div>
    </div>
  );
}

// ─── MODULE CARD ───────────────────────────────────────────────────
function ModuleCard({ title, count, label, pct, color, bg, Icon }) {
  return (
    <div style={{ background: '#fff', border: `1px solid ${C.border}`, borderRadius: 12, padding: '16px', display: 'flex', flexDirection: 'column', gap: 12, boxShadow: '0 1px 2px rgba(228,229,231,0.24)', flex: 1 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <div style={{ width: 36, height: 36, borderRadius: 10, background: bg, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <Icon c={color} s={18} />
        </div>
        <div>
          <div style={{ fontSize: 12, fontWeight: 600, color: C.fgMuted, letterSpacing: '0.01em' }}>{title}</div>
          <div style={{ fontSize: 20, fontWeight: 700, color: C.fg, lineHeight: 1.1 }}>{count}</div>
        </div>
      </div>
      <div>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
          <span style={{ fontSize: 11, color: C.fgMuted }}>{label}</span>
          <span style={{ fontSize: 11, fontWeight: 600, color }}>{pct}%</span>
        </div>
