<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #fff; font-family: 'Inter Tight', sans-serif; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row-label { font-size: 10px; font-weight: 600; color: #A4ABB8; text-transform: uppercase; letter-spacing: 0.08em; width: 70px; flex-shrink: 0; }
/* Base badge */
.badge { display: inline-flex; align-items: center; gap: 4px; font-family: 'Inter Tight', sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.01em; line-height: 1; padding: 4px 10px; border-radius: 9999px; }
.badge-sm { font-size: 11px; padding: 3px 8px; }
.badge-lg { font-size: 14px; padding: 5px 12px; }
/* Fill variants */
.badge-primary-fill { background: #0B266E; color: #fff; }
.badge-neutral-fill { background: #0D0D12; color: #fff; }
.badge-success-fill { background: #40C4AA; color: #fff; }
.badge-warning-fill { background: #D39C3D; color: #fff; }
.badge-error-fill { background: #DF1C41; color: #fff; }
.badge-sky-fill { background: #106A97; color: #fff; }
/* Subtle fill */
.badge-primary-subtle { background: rgba(11,38,110,0.08); color: #0B266E; }
.badge-neutral-subtle { background: #ECEFF3; color: #353849; }
.badge-success-subtle { background: #DDF2EE; color: #174E43; }
.badge-warning-subtle { background: #F9ECCB; color: #5B3D1E; }
.badge-error-subtle { background: #FADAE1; color: #710E21; }
/* Outlined */
.badge-primary-outline { background: #fff; color: #0B266E; border: 1px solid #3C518B; }
.badge-neutral-outline { background: #fff; color: #0D0D12; border: 1px solid #0D0D12; }
.badge-success-outline { background: #fff; color: #287F6E; border: 1px solid #40C4AA; }
.badge-error-outline { background: #fff; color: #DF1C41; border: 1px solid #ED8296; }
/* Dot */
.dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="row">
    <div class="row-label">Fill</div>
    <span class="badge badge-primary-fill">Primary</span>
    <span class="badge badge-neutral-fill">Neutral</span>
    <span class="badge badge-success-fill">Aktif</span>
    <span class="badge badge-warning-fill">Pending</span>
    <span class="badge badge-error-fill">Nonaktif</span>
    <span class="badge badge-sky-fill">Info</span>
  </div>
  <div class="row">
    <div class="row-label">Subtle</div>
    <span class="badge badge-primary-subtle">Modul Baru</span>
    <span class="badge badge-neutral-subtle">Draft</span>
    <span class="badge badge-success-subtle">Lulus</span>
    <span class="badge badge-warning-subtle">Menunggu</span>
    <span class="badge badge-error-subtle">Gagal</span>
  </div>
  <div class="row">
    <div class="row-label">Outline</div>
    <span class="badge badge-primary-outline">Purple</span>
    <span class="badge badge-neutral-outline">Neutral</span>
    <span class="badge badge-success-outline">Success</span>
    <span class="badge badge-error-outline">Error</span>
  </div>
  <div class="row">
    <div class="row-label">Sizes</div>
    <span class="badge badge-sm badge-primary-subtle">Small</span>
    <span class="badge badge-primary-subtle">Medium</span>
    <span class="badge badge-lg badge-primary-fill">Large</span>
  </div>
  <div class="row">
    <div class="row-label">With dot</div>
    <span class="badge badge-success-subtle"><span class="dot" style="background:#0B266E"></span>Aktif</span>
    <span class="badge badge-warning-subtle"><span class="dot" style="background:#D39C3D"></span>Menunggu</span>
    <span class="badge badge-error-subtle"><span class="dot" style="background:#DF1C41"></span>Nonaktif</span>
    <span class="badge badge-neutral-subtle"><span class="dot" style="background:#808897"></span>Draft</span>
  </div>
</body>
</html>
