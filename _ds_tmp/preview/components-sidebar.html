<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Geist:wght@700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #F6F8FA; font-family: 'Inter Tight', sans-serif; display: flex; align-items: flex-start; padding: 0; }
.sidebar { width: 272px; height: 560px; background: #fff; border-right: 1px solid #DFE1E7; display: flex; flex-direction: column; padding: 20px 0; overflow: hidden; }
/* Header */
.sidebar-header { padding: 8px; }
.sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 12px; }
.logo-box { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #3C518B, #0B266E); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.logo-box svg { width: 18px; height: 18px; }
.brand-text { display: flex; flex-direction: column; }
.brand-name { font-family: 'Geist', sans-serif; font-weight: 700; font-size: 18px; color: #0D0D12; line-height: 1.2; }
.brand-sub { font-size: 9px; font-weight: 600; color: #808897; line-height: 1.3; letter-spacing: 0.02em; }
.collapse-btn { margin-left: auto; width: 24px; height: 24px; border: 1px solid #DFE1E7; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: #fff; flex-shrink: 0; }
/* Menu sections */
.menu-section { padding: 0 16px; margin-top: 16px; display: flex; flex-direction: column; gap: 4px; }
.menu-section + .menu-section { margin-top: 8px; }
.section-title { font-size: 11px; font-weight: 500; color: #A4ABB8; letter-spacing: 0.04em; padding: 4px 12px; text-transform: uppercase; }
/* Menu items */
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; transition: background 0.12s; }
.nav-item:hover:not(.active) { background: #F6F8FA; }
.nav-item.active { background: #0B266E; }
.nav-icon { width: 18px; height: 18px; border-radius: 3px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.nav-icon svg { width: 16px; height: 16px; }
.nav-label { font-size: 14px; font-weight: 500; color: #353849; letter-spacing: 0.01em; }
.nav-item.active .nav-label { color: #fff; font-weight: 600; }
.nav-item.active .nav-icon svg { color: #fff; }
.nav-item.disabled .nav-label { color: #A4ABB8; }
.nav-item.disabled { opacity: 0.6; }
.badge-count { margin-left: auto; background: #FADAE1; color: #DF1C41; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 9999px; }
.nav-item.active .badge-count { background: rgba(255,255,255,0.25); color: #fff; }
/* Divider */
.divider { height: 1px; background: #F0F1F4; margin: 8px 16px; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <div class="logo-box">
        <svg viewBox="0 0 18 18" fill="white"><path d="M12.448 0L5.552 0L0 5.552L0 12.448L5.552 18L12.448 18L18 12.448L18 5.552L12.448 0ZM6.506 12.535L2.949 8.978L6.506 5.422C7.851 4.077 10.063 4.077 11.407 5.422L14.964 8.978L11.407 12.535C10.063 13.88 7.894 13.88 6.506 12.535Z"/></svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">SITKOM</div>
        <div class="brand-sub">Sistem Informasi Teknik Komputer</div>
      </div>
      <div class="collapse-btn">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#808897" stroke-width="1.5"><path d="M7 2L3 6L7 10"/></svg>
      </div>
    </div>
  </div>

  <div class="menu-section">
    <div class="section-title">Utama</div>
    <div class="nav-item active">
      <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>
      <span class="nav-label">Dashboard</span>
      <span class="badge-count">3</span>
    </div>
  </div>

  <div class="menu-section">
    <div class="section-title">Kendali</div>
    <div class="nav-item">
      <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#666D80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
      <span class="nav-label">Bank Soal</span>
    </div>
    <div class="nav-item">
      <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#666D80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <span class="nav-label">Manajemen Mahasiswa</span>
    </div>
    <div class="nav-item">
      <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#666D80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
      <span class="nav-label">Capstone</span>
    </div>
    <div class="nav-item">
      <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#666D80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13,2 13,9 20,9"/></svg></div>
      <span class="nav-label">E-Office</span>
    </div>
  </div>

  <div class="divider"></div>

  <div class="menu-section">
    <div class="section-title">Setting</div>
    <div class="nav-item">
      <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#666D80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
      <span class="nav-label">Modul Setting</span>
    </div>
    <div class="nav-item disabled">
      <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#A4ABB8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div>
      <span class="nav-label">System Monitor</span>
    </div>
  </div>
</div>
</body>
</html>
