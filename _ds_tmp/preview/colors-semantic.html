<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; font-family: 'Inter Tight', sans-serif; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .group { display: flex; flex-direction: column; gap: 4px; }
  .group-label { font-size: 10px; font-weight: 600; color: #808897; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px; }
  .row { display: flex; gap: 6px; }
  .swatch { flex: 1; border-radius: 6px; overflow: hidden; box-shadow: 0px 0px 0px 1px rgba(18,55,105,0.08); }
  .swatch-color { height: 36px; }
  .swatch-info { padding: 4px 6px; background: #fff; }
  .swatch-name { font-size: 10px; font-weight: 500; color: #353849; }
  .swatch-hex { font-size: 9px; color: #808897; }
</style>
</head>
<body>
<div class="group">
  <div class="group-label">Success (Green)</div>
  <div class="row">
    <div class="swatch"><div class="swatch-color" style="background:#DDF2EE"></div><div class="swatch-info"><div class="swatch-name">25</div><div class="swatch-hex">#DDF2EE</div></div></div>
    <div class="swatch"><div class="swatch-color" style="background:#9DE0D3"></div><div class="swatch-info"><div class="swatch-name">50</div><div class="swatch-hex">#9DE0D3</div></div></div>
    <div class="swatch"><div class="swatch-color" style="background:#40C4AA"></div><div class="swatch-info"><div class="swatch-name">100</div><div class="swatch-hex">#40C4AA</div></div></div>
    <div class="swatch"><div class="swatch-color" style="background:#287F6E"></div><div class="swatch-info"><div class="swatch-name">200</div><div class="swatch-hex">#287F6E</div></div></div>
    <div class="swatch"><div class="swatch-color" style="background:#174E43"></div><div class="swatch-info"><div class="swatch-name">300</div><div class="swatch-hex">#174E43</div></div></div>
  </div>
</div>
<div class="group">
  <div class="group-label">Warning (Amber)</div>
  <div class="row">
    <div class="swatch"><div class="swatch-color" style="background:#F9ECCB"></div><div class="swatch-info"><div class="swatch-name">25</div><div class="swatch-hex">#F9ECCB</div></div></div>
    <div class="swatch"><div class="swatch-color" style="background:#FBD982"></div><div class="swatch-info"><div class="swatch-name">50</div><div class="swatch-hex">#FBD982</div></div></div>
    <div class="swatch"><div class="swatch-color" style="background:#D39C3D"></div><div class="swatch-info"><div class="swatch-name">100</div><div class="swatch-hex">#D39C3D</div></div></div>
    <div class="swatch"><div class="swatch-color" style="background:#956321"></div><div class="swatch-info"><div class="swatch-name">200</div><div class="swatch-hex">#956321</div></div></div>
    <div class="swatch"><div class="swatch-color" style="background:#5B3D1E"></div><div class="swatch-info"><div class="swatch-name">300</div><div class="swatch-hex">#5B3D1E</div></div></div>
  </div>
</div>
<div class="group">
  <div class="group-label">Error (Red)</div>
  <div class="row">
    <div class="swatch"><div class="swatch-color" style="background:#FADAE1"></div><div class="swatch-info"><div class="swatch-name">25</div><div class="swatch-hex">#FADAE1</div></div></div>
    <div class="swatch"><div class="swatch-color" style="background:#ED8296"></div><div class="swatch-info"><div class="swatch-name">50</div><div class="swatch-hex">#ED8296</div></div></div>
    <div class="swatch"><div class="swatch-color" style="background:#DF1C41"></div><div class="swatch-info"><div class="swatch-name">100</div><div class="swatch-hex">#DF1C41</div></div></div>
    <div class="swatch"><div class="swatch-color" style="background:#95122B"></div><div class="swatch-info"><div class="swatch-name">200</div><div class="swatch-hex">#95122B</div></div></div>
    <div class="swatch"><div class="swatch-color" style="background:#710E21"></div><div class="swatch-info"><div class="swatch-name">300</div><div class="swatch-hex">#710E21</div></div></div>
  </div>
</div>
<div class="group">
  <div class="group-label">Sky (Cyan)</div>
  <div class="row">
    <div class="swatch"><div class="swatch-color" style="background:#D1F0F9"></div><div class="swatch-info"><div class="swatch-name">25</div><div class="swatch-hex">#D1F0F9</div></div></div>
    <div class="swatch"><div class="swatch-color" style="background:#7EDCF1"></div><div class="swatch-info"><div class="swatch-name">50</div><div class="swatch-hex">#7EDCF1</div></div></div>
    <div class="swatch"><div class="swatch-color" style="background:#106A97"></div><div class="swatch-info"><div class="swatch-name">200</div><div class="swatch-hex">#106A97</div></div></div>
    <div class="swatch"><div class="swatch-color" style="background:#0C4D6E"></div><div class="swatch-info"><div class="swatch-name">300</div><div class="swatch-hex">#0C4D6E</div></div></div>
  </div>
</div>
</body>
</html>
