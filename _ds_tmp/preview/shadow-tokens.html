<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #F6F8FA; font-family: 'Inter Tight', sans-serif; padding: 24px; }
.row { display: flex; gap: 16px; align-items: flex-end; }
.card { background: #fff; border-radius: 10px; display: flex; flex-direction: column; gap: 6px; padding: 16px; align-items: center; flex: 1; }
.card-name { font-size: 11px; font-weight: 600; color: #353849; }
.card-token { font-size: 10px; color: #808897; font-family: 'Geist', monospace; }
</style>
</head>
<body>
<div class="row">
  <div class="card" style="box-shadow: 0 1px 2px rgba(22,22,43,0.04)">
    <div class="card-name">XS</div><div class="card-token">--shadow-xs</div>
  </div>
  <div class="card" style="box-shadow: 0 1px 3px rgba(22,22,43,0.06), 0 1px 2px rgba(22,22,43,0.04)">
    <div class="card-name">SM</div><div class="card-token">--shadow-sm</div>
  </div>
  <div class="card" style="box-shadow: 0 4px 8px -2px rgba(22,22,43,0.06), 0 2px 4px -2px rgba(22,22,43,0.04)">
    <div class="card-name">MD</div><div class="card-token">--shadow-md</div>
  </div>
  <div class="card" style="box-shadow: 0 12px 20px -4px rgba(22,22,43,0.08), 0 4px 8px -4px rgba(22,22,43,0.04)">
    <div class="card-name">LG</div><div class="card-token">--shadow-lg</div>
  </div>
  <div class="card" style="box-shadow: 0 20px 25px -5px rgba(22,22,43,0.10), 0 8px 10px -6px rgba(22,22,43,0.04)">
    <div class="card-name">XL</div><div class="card-token">--shadow-xl</div>
  </div>
  <div class="card" style="box-shadow: 0px 0px 0px 1px rgba(18,55,105,0.08), 0px 1px 2px 0px rgba(9,25,72,0.13)">
    <div class="card-name">Inset</div><div class="card-token">--shadow-inset</div>
  </div>
</div>
</body>
</html>
